worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    default_type text/plain;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15s;
    client_max_body_size 1m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_x_request_id $correlation_id {
        default $request_id;
        "~^[A-Za-z0-9._:-]{1,64}$" $http_x_request_id;
    }

    log_format access_json escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$correlation_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"host":"$host",'
        '"pod":"$hostname"}';
    access_log /dev/stdout access_json;

    server {
        listen 8080;
        server_name _;
        add_header X-Request-ID $correlation_id always;
        add_header X-App-Version v1 always;

        location = / {
            return 200 "Hello World!\n";
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location = /readyz {
            access_log off;
            return 200 "ready\n";
        }

        location / {
            root /usr/share/nginx/html;
            log_not_found on;
        }
    }

    # The exporter sidecar reads this endpoint inside the same Pod.
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        access_log off;
        location = /stub_status {
            stub_status;
        }
        location / {
            return 404;
        }
    }
}
