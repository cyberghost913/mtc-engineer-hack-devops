# Only core Fluentd plugins; no runtime gem installation.
<system>
  workers 1
  log_level info
  file_permission 0600
  dir_permission 0700
</system>

<source>
  @type monitor_agent
  @id collector_health
  bind 127.0.0.1
  port 24220
</source>

<source>
  @type tail
  @id nginx_tail
  tag app.nginx
  path /var/log/pods/demo_nginx-*/nginx/*.log*
  exclude_path ["/var/log/pods/demo_nginx-*/nginx/*.gz", "/var/log/pods/demo_nginx-*/nginx/*.tmp"]
  path_key source_path
  pos_file /data/positions/nginx.pos
  pos_file_compaction_interval 1h
  read_from_head true
  follow_inodes true
  refresh_interval 5s
  rotate_wait 10s
  emit_unmatched_lines true
  <parse>
    @type regexp
    expression /^(?<cri_time>[^ ]+) (?<stream>stdout|stderr) (?<cri_flag>[FP]) (?<message>.*)$/
    # Keep CRI time as text; event time is collection time, used for file buckets.
  </parse>
</source>

<filter app.nginx>
  @type record_transformer
  @id source_identity
  enable_ruby true
  <record>
    namespace demo
    pod ${record["source_path"].split("/")[4].split("_")[1]}
    pod_uid ${record["source_path"].split("/")[4].split("_")[2]}
    container nginx
    node "#{ENV.fetch('NODE_NAME')}"
    collector fluentd
  </record>
</filter>

<filter app.nginx>
  @type parser
  @id nginx_json
  key_name message
  reserve_data true
  reserve_time true
  hash_value_field app
  emit_invalid_record_to_error false
  <parse>
    @type json
    # Preserve the application's time field without making it Fluentd event time.
    time_key _unused_event_time
  </parse>
</filter>

<match app.nginx>
  @type file
  @id nginx_archive
  path /data/archive/nginx.%Y%m%d%H%M
  path_suffix .jsonl
  append true
  <format>
    @type json
  </format>
  <inject>
    time_key collected_at
    time_type string
    time_format %Y-%m-%dT%H:%M:%S%z
    utc true
  </inject>
  <buffer time>
    @type file
    path /data/buffer/nginx
    timekey 1m
    timekey_wait 5s
    timekey_use_utc true
    flush_mode interval
    flush_interval 5s
    flush_thread_count 1
    chunk_limit_size 4m
    total_limit_size 256m
    queued_chunks_limit_size 64
    overflow_action block
    retry_forever true
    retry_max_interval 30s
  </buffer>
</match>
